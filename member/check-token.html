<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 连接检测 · 器材组扣分系统</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h1>🔧 API 连接诊断</h1>
        <div class="nav-links">
            <a href="home.html" class="btn btn-outline">← 返回主页</a>
            <a href="admin.html" class="btn btn-outline">管理面板</a>
            <a href="deduct.html" class="btn btn-outline">扣分操作</a>
        </div>
        <hr>

        <!-- 当前状态卡片 -->
        <section style="margin-bottom: 30px;">
            <h2>📡 当前状态</h2>
            <div id="status-panel" class="card" style="background: #f8fafc;">
                <p><strong>Cookie 中的 Token：</strong><span id="cookie-status">检查中...</span></p>
                <p><strong>Token 有效性：</strong><span id="token-validity">未检测</span></p>
                <p><strong>GitHub 用户：</strong><span id="github-user">—</span></p>
                <p><strong>API 速率限制：</strong><span id="rate-limit">—</span></p>
            </div>
            <button id="refresh-status-btn" class="btn">重新检测当前 Token</button>
            <button id="clear-token-btn" class="btn btn-outline" style="margin-left: 10px;">清除本地 Token</button>
        </section>

        <!-- 通过卡密获取并测试 -->
        <section style="margin-bottom: 30px;">
            <h2>🔑 使用卡密获取 Token</h2>
            <div class="form-group">
                <label for="key-input">输入卡密（key 文件名）</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="key-input" placeholder="例如：82048572" style="flex:1;">
                    <button id="fetch-token-btn" class="btn">获取并测试</button>
                </div>
            </div>
            <div id="key-result" class="message" style="display: none;"></div>
        </section>

        <!-- 手动输入 Token 测试 -->
        <section>
            <h2>✏️ 手动输入 Token 测试</h2>
            <div class="form-group">
                <label for="token-input">GitHub Personal Access Token</label>
                <textarea id="token-input" rows="3" placeholder="粘贴你的 GitHub Token..."></textarea>
            </div>
            <button id="test-token-btn" class="btn">测试此 Token</button>
            <button id="save-token-btn" class="btn btn-outline" style="margin-left: 10px;">保存到 Cookie 并测试</button>
            <div id="manual-result" class="message" style="display: none; margin-top: 16px;"></div>
        </section>
    </div>

    <script src="../js/github.js"></script>
    <script src="../js/token-test.js"></script>
</body>
</html>
