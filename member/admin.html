<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理面板 - 器材组</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h1>管理面板</h1>
        <section>
            <h2>成员分数列表</h2>
            <table>
                <thead><tr><th>学号</th><th>当前分数</th></tr></thead>
                <tbody id="score-table-body"></tbody>
            </table>
        </section>
        <section style="margin-top: 30px;">
            <h2>扣分记录查询</h2>
            <div class="form-inline">
                <input type="text" id="query-student-id" placeholder="输入学号">
                <button id="query-btn">查询</button>
            </div>
            <div id="query-result"></div>
        </section>
        <p style="margin-top:20px;">
            <a href="backend.html">← 返回后台主页</a> | <a href="home.html">前台主页</a>
        </p>
    </div>

    <!-- 预览模态容器（动态填充） -->
    <!-- 由 JS 动态创建，无需预留 -->

    <script src="../js/github.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
