<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能扣分系统 · 管理面板</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h1>📋 器材组 · 管理面板</h1>
        <div class="nav-links">
            <a href="home.html" class="btn btn-outline">← 返回主页</a>
            <a href="deduct.html" class="btn btn-outline">扣分操作</a>
        </div>
        <hr>

        <!-- 区块1：成员当前分数 -->
        <section>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>📊 成员当前分数</h2>
                <button id="refresh-scores-btn" class="btn btn-outline">刷新列表</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>学号</th>
                            <th>当前分数</th>
                        </tr>
                    </thead>
                    <tbody id="score-list-body">
                        <tr><td colspan="2" class="text-center">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <p style="margin-top: 8px; color: #64748b; font-size: 0.9rem;">分数为负数，表示累计扣分</p>
        </section>

        <hr>

        <!-- 区块2：全部扣分记录（自动扫描） -->
        <section>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>📝 全部扣分记录</h2>
                <button id="refresh-penalties-btn" class="btn btn-outline">刷新记录</button>
            </div>
            <div id="penalties-list-container" style="margin-top: 16px;">
                <div class="message info">加载中...</div>
            </div>
        </section>
    </div>

    <script src="../js/github.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
