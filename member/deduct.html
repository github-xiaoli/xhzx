<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能扣分系统 - 扣分操作</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h1>⚽ 器材组 · 智能扣分</h1>
        <div class="nav-links">
            <a href="home.html" class="btn btn-outline">← 返回主页</a>
            <a href="admin.html" class="btn btn-outline">管理面板</a>
        </div>
        <hr>

        <h2>新增扣分记录</h2>
        <form id="deduct-form">
            <div class="form-group">
                <label for="student_id">被扣分人学号 <span style="color: #ef4444;">*</span></label>
                <input type="text" id="student_id" name="student_id" placeholder="例如：20231326" required>
            </div>

            <div class="form-group">
                <label for="points">扣分分数 <span style="color: #ef4444;">*</span></label>
                <input type="number" id="points" name="points" min="1" step="1" placeholder="正整数" required>
            </div>

            <div class="form-group">
                <label for="reason">扣分理由 <span style="color: #ef4444;">*</span></label>
                <textarea id="reason" name="reason" placeholder="请详细说明扣分原因" required></textarea>
            </div>

            <div class="form-group">
                <label for="attachments">附件（可选，支持多文件）</label>
                <input type="file" id="attachments" name="attachments" multiple>
                <small style="color: #64748b; display: block; margin-top: 4px;">可上传图片、文档等作为证据</small>
            </div>

            <div id="message" class="message" style="display: none;"></div>

            <div class="form-group">
                <button type="submit" class="btn">提交扣分</button>
            </div>
        </form>
    </div>

    <script src="../js/github.js"></script>
    <script src="../js/deduct.js"></script>
    <script>
        // 页面初始化时显示消息区域（通过JS控制显示）
        const msgDiv = document.getElementById('message');
        msgDiv.style.display = 'block';
        // 覆盖 showMessage 函数以控制显示
        const originalShowMessage = window.showMessage;
        if (!originalShowMessage) {
            window.showMessage = function(text, type) {
                msgDiv.textContent = text;
                msgDiv.className = `message ${type}`;
                msgDiv.style.display = 'block';
            };
        }
    </script>
</body>
</html>
