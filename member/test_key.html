<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡密测试 - 器材组</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .token-display { 
            background: #f4f4f4; 
            padding: 10px; 
            border-radius: 5px; 
            word-break: break-all;
            font-family: monospace;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>卡密有效性测试</h1>
        <div id="message" class="message"></div>

        <div class="form-group">
            <label for="card-input">输入卡密</label>
            <input type="text" id="card-input" placeholder="例如 82048572" autofocus>
        </div>

        <button id="test-btn" class="btn">测试卡密</button>
        <button id="save-btn" class="btn" style="margin-left:10px; display:none;" onclick="saveCurrentToken()">💾 保存到浏览器</button>

        <div id="result-area" class="hidden" style="margin-top:20px;">
            <h3>解密结果</h3>
            <p><strong>明文字符串长度：</strong><span id="token-length"></span></p>
            <p><strong>部分预览：</strong><span id="token-preview" class="token-display"></span></p>
            <p><em>（完整 Token 已存储在内存中，点击“保存”可写入 Cookie）</em></p>
        </div>

        <p style="margin-top:25px;">
            <a href="backend.html">← 返回后台主页</a>
        </p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="../js/github.js"></script>
    <script>
        let currentToken = null;

        document.getElementById("test-btn").addEventListener("click", async () => {
            const card = document.getElementById("card-input").value.trim();
            const msgBox = document.getElementById("message");
            msgBox.textContent = "";
            msgBox.className = "message";

            if (!card) {
                msgBox.textContent = "请输入卡密";
                msgBox.className = "message error";
                return;
            }

            try {
                msgBox.textContent = "正在获取并解密...";
                msgBox.className = "message info";
                const encrypted = await fetchEncryptedKey(card);
                const token = decryptToken(encrypted);
                if (!token) throw new Error("解密结果为空");
                currentToken = token;

                // 显示结果
                document.getElementById("result-area").classList.remove("hidden");
                document.getElementById("token-length").textContent = token.length + " 字符";
                document.getElementById("token-preview").textContent = 
                    token.substring(0, 6) + "****" + token.substring(token.length - 4);
                document.getElementById("save-btn").style.display = "inline-block";
                msgBox.textContent = "✓ 卡密有效，解密成功！";
                msgBox.className = "message success";
            } catch (err) {
                currentToken = null;
                document.getElementById("result-area").classList.add("hidden");
                document.getElementById("save-btn").style.display = "none";
                msgBox.textContent = "❌ 测试失败: " + err.message;
                msgBox.className = "message error";
            }
        });

        function saveCurrentToken() {
            if (!currentToken) return;
            const card = document.getElementById("card-input").value.trim();
            setCookie("github_token", currentToken, 7);
            setCookie("card_key", card, 7);
            document.getElementById("message").textContent = "✓ Token 已保存到 Cookie，有效期7天";
            document.getElementById("message").className = "message success";
        }

        // 自动填入缓存的卡密
        (function() {
            const cachedCard = getCachedCard();
            if (cachedCard) {
                document.getElementById("card-input").value = cachedCard;
            }
        })();
    </script>
</body>
</html>
