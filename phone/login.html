<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>管理员登录(手机版) - 器材组</title>
    <link rel="stylesheet" href="../css/phone.css">
</head>
<body>
    <div class="container">
        <h1>🔐 管理员登录</h1>
        <div id="login-message" class="message"></div>
        <div id="login-form">
            <label for="admin-id">管理员 ID</label>
            <input type="text" id="admin-id" placeholder="如 admin01" autofocus>
            <label for="password">卡密</label>
            <input type="password" id="password" placeholder="输入解密卡密">
            <button id="login-btn">登录</button>
            <a href="#" id="show-change-card" style="display:block; text-align:center; margin-top:10px;">修改卡密</a>
        </div>
        <div id="change-card-form" style="display:none;">
            <h2>修改卡密</h2>
            <label for="old-password">旧卡密</label>
            <input type="password" id="old-password">
            <label for="new-password">新卡密</label>
            <input type="password" id="new-password">
            <button id="change-btn">确认修改</button>
            <a href="#" id="show-login" style="display:block; text-align:center; margin-top:10px;">返回登录</a>
        </div>
    </div>
    <script src="../js/github.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.getElementById("login-btn").addEventListener("click", async () => {
            const adminId = document.getElementById("admin-id").value.trim();
            const pwd = document.getElementById("password").value;
            const msgBox = document.getElementById("login-message");
            if (!adminId || !pwd) { msgBox.textContent = "请填写完整"; msgBox.className = "message error"; return; }
            msgBox.textContent = "正在验证..."; msgBox.className = "message info";
            try {
                const params = new URLSearchParams(window.location.search);
                const redirect = params.get("redirect") || "backend.html";
                await performLogin(adminId, pwd, redirect);
            } catch (err) {
                msgBox.textContent = err.message; msgBox.className = "message error";
            }
        });
        document.getElementById("show-change-card").addEventListener("click", (e) => {
            e.preventDefault();
            document.getElementById("login-form").style.display = "none";
            document.getElementById("change-card-form").style.display = "block";
        });
        document.getElementById("show-login").addEventListener("click", (e) => {
            e.preventDefault();
            document.getElementById("login-form").style.display = "block";
            document.getElementById("change-card-form").style.display = "none";
        });
        document.getElementById("change-btn").addEventListener("click", async () => {
            const adminId = document.getElementById("admin-id").value.trim();
            const oldPwd = document.getElementById("old-password").value;
            const newPwd = document.getElementById("new-password").value;
            const msgBox = document.getElementById("login-message");
            if (!adminId || !oldPwd || !newPwd) { msgBox.textContent = "请填写所有字段"; msgBox.className = "message error"; return; }
            try {
                await changePassword(adminId, oldPwd, newPwd);
                msgBox.textContent = "卡密修改成功";
                msgBox.className = "message success";
                document.getElementById("change-card-form").style.display = "none";
                document.getElementById("login-form").style.display = "block";
            } catch (err) {
                msgBox.textContent = err.message; msgBox.className = "message error";
            }
        });
    </script>
</body>
</html>
