<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>扣分/加分 - 手机版</title>
    <link rel="stylesheet" href="../css/phone.css">
</head>
<body>
<div class="container">
    <h1>⚡ 扣分/加分</h1>
    <div id="message"></div>
    <form id="deduct-form">
        <label>学号</label>
        <input type="text" id="student_id" placeholder="8位学号" required>

        <label>操作类型</label>
        <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 10px;">
            <label><input type="radio" name="operation_type" value="deduct" checked> 扣分</label>
            <label><input type="radio" name="operation_type" value="bonus"> 加分</label>
        </div>
        <small style="color:#888;">扣分0分表示警告；加分必须为正数</small>

        <label>分值（支持小数）</label>
        <input type="number" id="points" step="0.1" min="0" placeholder="0 或正数" required>

        <label>理由</label>
        <textarea id="reason" rows="3" placeholder="原因" required></textarea>

        <label>附件（可选）</label>
        <input type="file" id="attachments" multiple>

        <button type="submit">确认操作</button>
        <button type="button" onclick="window.location.href='backend.html'" style="background:#6c757d;">返回后台</button>
    </form>
</div>

<script src="../js/github.js"></script>
<script src="../js/deduct.js"></script>
</body>
</html>
