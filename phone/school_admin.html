<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>校内违纪 - 手机版</title>
    <link rel="stylesheet" href="../css/phone.css">
</head>
<body>
<div class="container">
    <h1>🏫 校内违纪管理</h1>
    <div id="message"></div>

    <h2>录入违纪</h2>
    <form id="school-form">
        <label>学号 (8位)</label>
        <input type="text" id="school-student-id" placeholder="如20260301" required>
        <label>姓名</label>
        <input type="text" id="school-name" required>
        <label>分值（支持小数，0分警告）</label>
        <input type="number" id="school-points" step="0.1" min="0" required>
        <label>违纪事由</label>
        <textarea id="school-reason" rows="3" required></textarea>
        <label>附件（可选）</label>
        <input type="file" id="school-attachments" multiple>
        <button type="submit">保存记录</button>
    </form>

    <hr>
    <h2>查询记录</h2>
    <input type="text" id="school-query-id" placeholder="输入学号" style="margin-bottom:8px;">
    <button id="school-query-btn">查询</button>
    <div id="school-query-result"></div>

    <br>
    <button onclick="window.location.href='backend.html'" style="background:#6c757d;">返回后台</button>
</div>

<script src="../js/github.js"></script>
<script src="../js/school_penalty.js"></script>
</body>
</html>
