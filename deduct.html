<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扣分操作 - 器材组</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h1>扣分操作</h1>
        <div id="message" class="message"></div>
        <form id="deduct-form">
            <div class="form-group">
                <label for="student_id">被扣分人学号</label>
                <input type="text" id="student_id" required autofocus>
            </div>
            <div class="form-group">
                <label for="points">扣分分数（正整数）</label>
                <input type="number" id="points" min="1" step="1" required>
            </div>
            <div class="form-group">
                <label for="reason">扣分理由</label>
                <textarea id="reason" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label for="attachments">附件（可选，可多选）</label>
                <input type="file" id="attachments" multiple>
            </div>
            <button type="submit">提交扣分</button>
        </form>
        <p><a href="backend.html">← 返回后台</a></p>
    </div>
    <script src="../js/github.js"></script>
    <script src="../js/deduct.js"></script>
</body>
</html>
